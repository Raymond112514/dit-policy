defaults:
  - features: resnet_gn_nopool
  - _self_

_target_: data4robotics.models.diffusion.DiffusionTransformerAgent
odim: ${task.obs_dim}
n_cams: ${task.n_cams}
use_obs: add_token
dropout: 0.1
train_diffusion_steps: 100
eval_diffusion_steps: 8
ac_dim: ${task.ac_dim}
ac_chunk: ${ac_chunk}
imgs_per_cam: ${add:${img_chunk},${len:${task.train_buffer.goal_indexes}}}
share_cam_features: False
early_fusion: False
feat_norm: null
token_dim: 256
task_conditioning: ${task_conditioning}
task_conditioning_mode: ${task_conditioning_mode}
language_embedding_path: ${language_embedding_path}

noise_net_kwargs:
  time_dim: 128
  hidden_dim: 256
  num_blocks: 4
  dim_feedforward: 512
  dropout: ${agent.dropout}
  nhead: 8
  activation: "gelu"
