defaults:
  - agent: default
  - task: end_effector
  - trainer: bc
  - override hydra/launcher: slurm
  - _self_

hydra:
  run:
    dir: bc_finetune/${exp_name}/wandb_${wandb.name}_${hydra:runtime.choices.task}_${hydra:runtime.choices.agent/features}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: ${base:}/../bc_finetune/${exp_name}/${now:%Y-%m-%d_%H-%M-%S}
    subdir: run${hydra:job.num}_${hydra:runtime.choices.task}_${hydra:runtime.choices.agent/features}

rt: ${hydra:runtime.choices.agent/features}

exp_name: robocasa_pretrain
checkpoint_path: ${exp_name}.ckpt
batch_size: 150
num_workers: 10
lr: 0.0003
max_iterations: 5000
eval_freq: 500
save_freq: 10000
schedule_freq: 1
devices: 1
seed: 0

buffer_path: /home/raymond112514/dit-policy/robocasa_converted/buf.pkl
ac_chunk: 10
img_chunk: 1  
train_transform: medium

# Task conditioning (scene=23d one-hot, text=90d task one-hot, language=768d BERT)
task_conditioning: false
task_conditioning_mode: language
language_embedding_path: /home/raymond112514/DSRL/libero_commands_bert_embeddings.pkl

wandb:
  name: ${exp_name}
  project: libero_dit
  group: ${exp_name}
  sweep_name_prefix: null
  debug: False
  entity: raymond1123581321-university-of-california-berkeley
